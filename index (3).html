<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malappuram Work Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a register-style worklist. Summary tiles double as filters, category tabs sit above one ruled list, and a side sheet holds the task form and its activity log. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E9EDF3;
  --ink: #14213D;
  --ink-2: #4A5876;
  --line: #D3DAE5;
  --accent: #0E5E6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EBEF;
  --bad: #B3261E;
  --bad-soft: #FBE3E0;
  --warn: #85560A;
  --warn-soft: #FAEDCB;
  --ok: #1D6A39;
  --ok-soft: #DCEFE2;
  --info: #2C4A9A;
  --info-soft: #E0E6F7;
  --shadow: 0 12px 40px rgba(20, 33, 61, .22);
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1623; --surface: #172033; --surface-2: #1E2A40; --ink: #E7ECF5; --ink-2: #A3B0C8; --line: #2C3A55;
    --accent: #5CC1D4; --accent-ink: #08222A; --accent-soft: #163845;
    --bad: #FF8F85; --bad-soft: #3B1C1C; --warn: #F2C35B; --warn-soft: #3A2D12;
    --ok: #74D294; --ok-soft: #15321F; --info: #93AAFF; --info-soft: #1B2548;
    --shadow: 0 12px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1623; --surface: #172033; --surface-2: #1E2A40; --ink: #E7ECF5; --ink-2: #A3B0C8; --line: #2C3A55;
  --accent: #5CC1D4; --accent-ink: #08222A; --accent-soft: #163845;
  --bad: #FF8F85; --bad-soft: #3B1C1C; --warn: #F2C35B; --warn-soft: #3A2D12;
  --ok: #74D294; --ok-soft: #15321F; --info: #93AAFF; --info-soft: #1B2548;
  --shadow: 0 12px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; display: flex; flex-direction: column; gap: 18px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.eyebrow { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: -.01em; font-weight: 700; text-wrap: balance; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.who label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.who input { width: 11rem; }

/* controls */
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 4.5rem; }
input::placeholder, textarea::placeholder { color: var(--ink-2); opacity: .75; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.link { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn.link:hover { text-decoration: underline; border-color: transparent; }

.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-weight: 500; }

/* summary tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.6rem, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: var(--ink-2); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .n { font-family: var(--font-mono); font-size: 26px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.tile.bad .n { color: var(--bad); }
.tile.warn .n { color: var(--warn); }
.tile.ok .n { color: var(--ok); }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { border-color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tab .c { font-family: var(--font-mono); font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }

.filters { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: 10px; }

/* list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head, .row { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 11rem 9.5rem; gap: 6px 18px; padding: 12px 16px; }
.head { background: var(--surface-2); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); padding-block: 8px; }
.row { border-top: 1px solid var(--line); align-items: start; }
.head + .row { border-top: 0; }
.due { grid-area: due; display: flex; flex-direction: column; gap: 2px; }
.due .d { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.due .r { font-size: 12.5px; font-weight: 600; }
.r.bad { color: var(--bad); } .r.warn { color: var(--warn); } .r.ok { color: var(--ok); } .r.neutral { color: var(--ink-2); }
.main { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.client { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.type { color: var(--ink-2); overflow-wrap: anywhere; }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.note { color: var(--ink-2); font-size: 12.5px; overflow-wrap: anywhere; }
.people { grid-area: people; display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; }
.people div { display: flex; gap: 8px; min-width: 0; }
.people .k { color: var(--ink-2); width: 4.2rem; flex: none; font-size: 12px; }
.people .v { overflow-wrap: anywhere; min-width: 0; }
.people .none { color: var(--ink-2); font-style: italic; }
.state { grid-area: status; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.sample { background: transparent; border: 1px dashed var(--ink-2); color: var(--ink-2); font-weight: 600; margin-left: 6px; vertical-align: 2px; font-size: 11px; }
.empty { padding: 36px 20px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty strong { color: var(--ink); font-size: 16px; }
.empty p { margin: 0; max-width: 46ch; }
.empty .acts { justify-content: center; }
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--ink-2); font-size: 12.5px; }

@media (max-width: 820px) {
  .head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main main" "due status" "people people"; }
  .state { align-items: flex-end; }
  .acts { justify-content: flex-end; }
  .filters { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 24px; }
}

/* side sheet */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 30, .5); z-index: 20; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(560px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-head h2 { margin: 0 0 6px; font-size: 19px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.sheet-foot .right { display: flex; gap: 8px; margin-left: auto; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend { padding: 0; margin-bottom: 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 .full { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: 12.5px; font-weight: 600; }
.fld label .req { color: var(--accent); font-weight: 600; }
.fld .hint { font-size: 12px; color: var(--ink-2); }
.fld input.mono { font-family: var(--font-mono); }
.msg { margin: 0; padding: 9px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.flow { display: flex; gap: 6px; flex-wrap: wrap; }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.log li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; font-size: 13px; }
.log time { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.log .by { font-weight: 600; }
@media (max-width: 560px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .log li { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; max-width: min(92vw, 520px); box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

html, body { margin: 0; }
[hidden] { display: none !important; }
body { min-height: 100vh; }
#work { display: flex; flex-direction: column; gap: 18px; }
.acct { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.connect { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.connect h2 { margin: 0; font-size: 20px; }
.connect p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: var(--bg); }
.card h3 { margin: 0; font-size: 15px; }
.card p { font-size: 13px; }
.linkbox { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.linkbox p { margin: 0; }
.linkrow { display: flex; gap: 8px; flex-wrap: wrap; }
.linkrow input { flex: 1; min-width: 12rem; font-family: var(--font-mono); font-size: 12.5px; }
code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">DSG &amp; Associates CS LLP</p>
      <h1>Malappuram Work Tracker</h1>
    </div>
    <div class="who">
      <label for="me">Working as</label>
      <input id="me" type="text" placeholder="Your name" autocomplete="off" list="dl-people">
      <button class="btn primary" id="add" type="button" hidden>Add task</button>
      <span class="acct" id="acct"></span>
      <button class="btn small" id="team" type="button" hidden>Team link</button>
      <button class="btn small" id="signout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <div class="linkbox" id="linkbox" hidden>
    <p><strong>Team link.</strong> Anyone who has this link can open and change the tracker, so share it only with your staff. Each person pastes it once when they first open the tracker.</p>
    <div class="linkrow"><label class="sr" for="linkval">Team link</label><input id="linkval" type="text" readonly><button class="btn" id="linkcopy" type="button">Copy</button><button class="btn" id="linkclose" type="button">Close</button></div>
  </div>
  <section class="connect" id="connect"><p>Starting</p></section>
  <div id="work" hidden>
  <div class="banner" id="banner" hidden></div>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div class="tabs" id="tabs" role="tablist" aria-label="Work category"></div>
  <div class="filters">
    <div><label class="sr" for="q">Search</label><input id="q" type="search" placeholder="Search client, task, SRN or UDIN" autocomplete="off"></div>
    <div><label class="sr" for="who">Person</label><select id="who"></select></div>
  </div>
  <section class="list" id="list" aria-live="polite"></section>
  <div class="foot" id="foot"></div>
  </div>
</div>

<datalist id="dl-people"></datalist>
<datalist id="dl-clients"></datalist>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <div class="sheet-head">
      <div>
        <h2 id="sheet-title">New task</h2>
        <div id="sheet-status"></div>
      </div>
      <button type="button" class="btn small" id="sheet-close">Close</button>
    </div>
    <div class="sheet-body">
      <p class="msg" id="sheet-msg" role="alert" hidden></p>
      <div class="flow" id="sheet-flow"></div>
      <fieldset>
        <legend>Task</legend>
        <div class="grid2">
          <div class="fld full"><label for="f-client">Client</label><input id="f-client" type="text" list="dl-clients" autocomplete="off" placeholder="Company or LLP name"></div>
          <div class="fld"><label for="f-cat">Category</label><select id="f-cat"></select></div>
          <div class="fld"><label for="f-type">Task</label><select id="f-type"></select></div>
          <div class="fld"><label for="f-due">Due date</label><input id="f-due" type="date"></div>
          <div class="fld"><label>&nbsp;</label><span class="hint" id="f-hint"></span></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Maker and checker</legend>
        <div class="grid2">
          <div class="fld"><label for="f-maker">Maker (drafts and files)</label><input id="f-maker" type="text" list="dl-people" autocomplete="off" placeholder="Name"></div>
          <div class="fld"><label for="f-checker">Checker (reviews and signs off)</label><input id="f-checker" type="text" list="dl-people" autocomplete="off" placeholder="Name"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Filing references</legend>
        <div class="grid2">
          <div class="fld"><label for="f-srn" id="lab-srn">SRN</label><input id="f-srn" class="mono" type="text" autocomplete="off"></div>
          <div class="fld"><label for="f-udin" id="lab-udin">UDIN</label><input id="f-udin" class="mono" type="text" autocomplete="off"></div>
          <div class="fld"><label for="f-ack" id="lab-ack">Challan / acknowledgement no.</label><input id="f-ack" class="mono" type="text" autocomplete="off"></div>
          <div class="fld"><label for="f-filed">Filed on</label><input id="f-filed" type="date"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Notes</legend>
        <div class="fld"><label class="sr" for="f-notes">Notes</label><textarea id="f-notes" placeholder="Documents awaited, client instructions, query raised"></textarea></div>
      </fieldset>
      <fieldset id="log-box">
        <legend>Activity</legend>
        <ol class="log" id="f-log"></ol>
      </fieldset>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn danger" id="f-delete">Delete task</button>
      <div class="right">
        <button type="button" class="btn" id="f-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="f-save">Save task</button>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

    all.forEach(function (c) {
      box.append(h("button", {
        type: "button", role: "tab", class: "tab", "aria-selected": view.cat === c.id ? "true" : "false",
        title: c.full || c.label,
        onclick: function () { view.cat = c.id; render(); }
      }, h("span", { text: c.label }), h("span", { class: "c", text: String(openCount(c.id)) })));
    });
  }
  function renderPeople() {
    var names = {}, clients = {};
    (tasks || []).forEach(function (t) {
      [t.maker, t.checker].forEach(function (n) { if (norm(n)) names[String(n).trim()] = 1; });
      if (norm(t.client)) clients[String(t.client).trim()] = 1;
    });
    var list = Object.keys(names).sort(function (a, b) { return a.localeCompare(b); });
    var sel = $("who"); sel.replaceChildren(h("option", { value: "", text: "Everyone" }));
    list.forEach(function (n) { sel.append(h("option", { value: n, text: n })); });
    if (view.who && list.indexOf(view.who) === -1) view.who = "";
    sel.value = view.who;
    $("dl-people").replaceChildren.apply($("dl-people"), list.map(function (n) { return h("option", { value: n }); }));
    $("dl-clients").replaceChildren.apply($("dl-clients"), Object.keys(clients).sort().map(function (n) { return h("option", { value: n }); }));
  }
  function emptyBlock() {
    var total = (tasks || []).length;
    if (total === 0) {
      return h("div", { class: "empty" },
        h("strong", { text: "No tasks yet" }),
        h("p", { text: "Add the first task for a Malappuram client, or load a few sample tasks to see how the maker and checker steps work. Sample tasks are marked and can be removed in one click." }),
        h("div", { class: "acts" },
          h("button", { type: "button", class: "btn primary", onclick: function () { openSheet(null); } }, "Add first task"),
          h("button", { type: "button", class: "btn", onclick: addSamples }, "Load sample tasks")));
    }
    return h("div", { class: "empty" },
      h("strong", { text: "Nothing matches these filters" }),
      h("p", { text: "Try another category, status or search term." }),
      h("div", { class: "acts" }, h("button", { type: "button", class: "btn", onclick: clearFilters }, "Clear filters")));
  }
  function clearFilters() { view = { cat: "all", f: "open", who: "", q: "" }; $("q").value = ""; render(); }
  function renderListBody() {
    var box = $("list"); box.replaceChildren();
    var rows = sortList(applyState(baseList()));
    if (!rows.length) { box.append(emptyBlock()); }
    else {
      box.append(h("div", { class: "head", "aria-hidden": "true" }, h("span", { text: "Due" }), h("span", { text: "Client and task" }), h("span", { text: "Maker and checker" }), h("span", { text: "Status" })));
      rows.forEach(function (t) { box.append(rowEl(t)); });
    }
    var hasSample = (tasks || []).some(function (t) { return t.sample; });
    var foot = $("foot"); foot.replaceChildren(
      h("span", { text: rows.length + (rows.length === 1 ? " task shown" : " tasks shown") + " of " + (tasks || []).length }),
      hasSample ? h("button", { type: "button", class: "btn link", onclick: removeSamples }, "Remove sample tasks") : null);
  }
  function rowEl(t) {
    var cat = catOf(t.cat), di = dueInfo(t), act = actionsFor(t);
    var refs = [];
    if (t.srn) refs.push("SRN " + t.srn);
    if (t.udin) refs.push("UDIN " + t.udin);
    if (t.ack) refs.push("Ack " + t.ack);
    var acts = h("div", { class: "acts" });
    if (act.primary) acts.append(h("button", { type: "button", class: "btn small primary", onclick: function (e) { e.stopPropagation(); tryMove(t, act.primary.to); } }, act.primary.label));
    if (act.secondary) acts.append(h("button", { type: "button", class: "btn small", onclick: function (e) { e.stopPropagation(); tryMove(t, act.secondary.to); } }, act.secondary.label));
    acts.append(h("button", { type: "button", class: "btn small link", onclick: function () { openSheet(t); } }, "Open"));
    return h("article", { class: "row" },
      h("div", { class: "due" },
        h("span", { class: "d", text: t.status === "filed" ? fmt(t.due) : fmt(t.due) }),
        h("span", { class: "r " + di.tone, text: di.text })),
      h("div", { class: "main" },
        h("div", { class: "client" }, t.client || "Untitled client", t.sample ? h("span", { class: "pill sample", text: "Sample" }) : null),
        h("div", { class: "type", text: (t.type || "") + (cat ? "  ·  " + cat.label : "") }),
        refs.length ? h("div", { class: "refs" }, refs.map(function (r) { return h("span", { text: r }); })) : null,
        t.notes ? h("div", { class: "note", text: t.notes.length > 110 ? t.notes.slice(0, 107) + "..." : t.notes }) : null),
      h("div", { class: "people" },
        h("div", null, h("span", { class: "k", text: "Maker" }), t.maker ? h("span", { class: "v", text: t.maker }) : h("span", { class: "v none", text: "Unassigned" })),
        h("div", null, h("span", { class: "k", text: "Checker" }), t.checker ? h("span", { class: "v", text: t.checker }) : h("span", { class: "v none", text: "Unassigned" }))),
      h("div", { class: "state" }, h("span", { class: "pill " + ST[t.status].tone, text: ST[t.status].l }), acts));
  }

  /* ---------- side sheet ---------- */
  function fillTypes(catId, keep) {
    var sel = $("f-type"); sel.replaceChildren();
    var c = catOf(catId) || CATS[0];
    c.types.forEach(function (ty) { sel.append(h("option", { value: ty.n, text: ty.n })); });
    if (keep && typeOf(catId, keep)) sel.value = keep;
    updateTypeUi();
  }
  function updateTypeUi() {
    var ty = typeOf($("f-cat").value, $("f-type").value);
    $("f-hint").textContent = ty && ty.hint ? "Usual due date: " + ty.hint + ". Guide only. Confirm against the current MCA or SEBI notification." : "";
    ["srn", "udin", "ack"].forEach(function (k) {
      var lab = $("lab-" + k);
      var base = k === "srn" ? "SRN" : k === "udin" ? "UDIN" : "Challan / acknowledgement no.";
      lab.replaceChildren(document.createTextNode(base));
      if (ty && ty.ref === k) lab.append(h("span", { class: "req", text: "  required to mark filed" }));
    });
  }
  function sheetMsg(msg) { var el = $("sheet-msg"); el.textContent = msg || ""; el.hidden = !msg; }
  function openSheet(t, opts) {
    opts = opts || {};
    editing = t;
    opener = document.activeElement;
    sheetMsg(opts.msg || "");
    var cat = t ? t.cat : (view.cat !== "all" ? view.cat : CATS[0].id);
    var catSel = $("f-cat");
    catSel.replaceChildren();
    CATS.forEach(function (c) { catSel.append(h("option", { value: c.id, text: c.full })); });
    catSel.value = cat;
    fillTypes(cat, t ? t.type : "");
    $("f-client").value = t ? (t.client || "") : "";
    $("f-due").value = t ? (t.due || "") : "";
    $("f-maker").value = t ? (t.maker || "") : me();
    $("f-checker").value = t ? (t.checker || "") : "";
    $("f-srn").value = t ? (t.srn || "") : "";
    $("f-udin").value = t ? (t.udin || "") : "";
    $("f-ack").value = t ? (t.ack || "") : "";
    $("f-filed").value = t ? (t.filedOn || "") : "";
    $("f-notes").value = t ? (t.notes || "") : "";
    $("sheet-title").textContent = t ? (t.client || "Task") : "New task";
    var st = $("sheet-status"); st.replaceChildren();
    if (t) st.append(h("span", { class: "pill " + ST[t.status].tone, text: ST[t.status].l }), t.sample ? h("span", { class: "pill sample", text: "Sample" }) : null);
    renderFlow();
    renderLog();
    $("f-delete").hidden = !t;
    $("log-box").hidden = !t;
    $("f-save").textContent = t ? "Save changes" : "Add task";
    resetDelete();
    $("overlay").hidden = false;
    setTimeout(function () { focusId(opts.focus || (t ? "f-notes" : "f-client")); if (!opts.focus && t) $("sheet").querySelector(".sheet-body").scrollTop = 0; }, 30);
  }
  function renderFlow() {
    var box = $("sheet-flow"); box.replaceChildren();
    if (!editing) return;
    var act = actionsFor(editing);
    [act.primary, act.secondary].forEach(function (a, i) {
      if (!a) return;
      box.append(h("button", { type: "button", class: "btn small" + (i === 0 ? " primary" : ""), onclick: function () { sheetMove(a.to); } }, a.label));
    });
  }
  function renderLog() {
    var box = $("f-log"); box.replaceChildren();
    var list = editing && editing.log ? editing.log.slice().reverse() : [];
    if (!list.length) { box.append(h("li", null, h("span"), h("span", { text: "No activity recorded yet." }))); return; }
    list.forEach(function (e) {
      box.append(h("li", null, h("time", { text: fmtStamp(e.at) }), h("span", null, h("span", { class: "by", text: e.by + ": " }), e.text)));
    });
  }
  function closeSheet() {
    $("overlay").hidden = true; editing = null;
    if (opener && opener.focus) try { opener.focus(); } catch (e) { /* ignore */ }
  }
  function readForm() {
    return {
      client: $("f-client").value.trim(),
      cat: $("f-cat").value,
      type: $("f-type").value,
      due: $("f-due").value,
      maker: $("f-maker").value.trim(),
      checker: $("f-checker").value.trim(),
      srn: $("f-srn").value.trim(),
      udin: $("f-udin").value.trim(),
      ack: $("f-ack").value.trim(),
      filedOn: $("f-filed").value,
      notes: $("f-notes").value.trim()
    };
  }
  var FIELD_NAMES = { client: "client", cat: "category", type: "task", due: "due date", maker: "maker", checker: "checker", srn: "SRN", udin: "UDIN", ack: "acknowledgement no.", filedOn: "filed date", notes: "notes" };
  function validateForm(f) {
    if (!f.client) return { msg: "Enter the client name.", focus: "f-client" };
    if (!f.type) return { msg: "Choose the task.", focus: "f-type" };
    if (!f.due) return { msg: "Enter the due date. Every task here has a deadline to track.", focus: "f-due" };
    if (f.maker && same(f.maker, f.checker)) return { msg: "The maker and the checker must be different people.", focus: "f-checker" };
    return null;
  }
  function sheetMove(to) {
    var f = readForm(), bad = validateForm(f);
    if (bad) { sheetMsg(bad.msg); focusId(bad.focus); return; }
    sheetMsg("");
    tryMove(editing, to, f, true).then(function (ok) { if (ok) closeSheet(); });
  }
  function saveForm(e) {
    e.preventDefault();
    if (!store.ready()) { toast("Connect to OneDrive first."); return; }
    var f = readForm(), bad = validateForm(f);
    if (bad) { sheetMsg(bad.msg); focusId(bad.focus); return; }
    sheetMsg("");
    var now = Date.now(), p;
    if (!editing) {
      
      var obj = Object.assign({}, f, { status: "todo", createdAt: now, updatedAt: now, log: [{ at: now, by: me() || "Someone", text: "Task created" }] });
      p = store.add([obj]);
    } else {
      var changed = Object.keys(FIELD_NAMES).filter(function (k) { return (editing[k] || "") !== f[k] && k !== "notes"; });
      var notesChanged = (editing.notes || "") !== f.notes;
      var patch = Object.assign({}, f, { updatedAt: now });
      var labels = changed.map(function (k) { return FIELD_NAMES[k]; });
      if (notesChanged) labels.push("notes");
      if (labels.length) patch.log = logWith(editing, "Edited " + labels.join(", "));
      p = store.update(editing.id, patch);
    }
    p.then(function () { toast(editing ? "Changes saved" : "Task added"); closeSheet(); }, writeFail);
  }
  var delTimer = null;
  function resetDelete() { var b = $("f-delete"); clearTimeout(delTimer); b.classList.remove("armed"); b.textContent = "Delete task"; }
  function deleteClick() {
    var b = $("f-delete");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Click again to delete";
      delTimer = setTimeout(resetDelete, 4000); return;
    }
    resetDelete();
    if (!editing || !store.ready()) return;
    store.remove([editing.id]).then(function () { toast("Task deleted"); closeSheet(); }, writeFail);
  }

  /* ---------- sample tasks ---------- */
  function addSamples() {
    if (!store.ready()) { toast("Connect to OneDrive first."); return; }
    var S = [
      { client: "Sample: Alpha Traders Pvt Ltd", cat: "annual", type: "DIR-3 KYC (Director KYC)", off: -2, maker: "Trainee A", checker: "CS B", status: "drafting" },
      { client: "Sample: Beta Foods LLP", cat: "annual", type: "MSME-1 (Half-yearly return)", off: 5, maker: "Trainee A", checker: "CS B", status: "review" },
      { client: "Sample: Gamma Infra Pvt Ltd", cat: "event", type: "PAS-3 (Return of allotment)", off: 12, maker: "Trainee C", checker: "CS B", status: "todo" },
      { client: "Sample: Delta Tech Pvt Ltd", cat: "audit", type: "Secretarial Audit Report (MR-3)", off: 25, maker: "CS B", checker: "Partner D", status: "drafting" },
      { client: "Sample: Epsilon Ventures LLP", cat: "meetings", type: "AGM: notice, agenda, minutes", off: 3, maker: "Trainee C", checker: "CS B", status: "approved" },
      { client: "Sample: Zeta Retail Pvt Ltd", cat: "annual", type: "AOC-4 (Financial Statements)", off: -10, maker: "Trainee A", checker: "CS B", status: "filed", srn: "SAMPLE0001", filedOn: addDays(-12) }
    ];
    var now = Date.now();
    var jobs = S.map(function (s, i) {
      var o = { client: s.client, cat: s.cat, type: s.type, due: addDays(s.off), maker: s.maker, checker: s.checker, srn: s.srn || "", udin: "", ack: "", filedOn: s.filedOn || "", notes: "", status: s.status, sample: true, createdAt: now + i, updatedAt: now + i,
        log: [{ at: now + i, by: "Sample data", text: "Task created" }] };
      return o;
    });
    store.add(jobs).then(function () { toast("Sample tasks added"); }, writeFail);
  }
  function removeSamples() {
    if (!store.ready()) return;
    var ids = (tasks || []).filter(function (t) { return t.sample; }).map(function (t) { return t.id; });
    store.remove(ids).then(function () { toast("Sample tasks removed"); }, writeFail);
  }

  /* ---------- wiring ---------- */
  $("me").value = lsGet("dsg-tracker-me");
  $("me").addEventListener("change", function () { lsSet("dsg-tracker-me", me()); });
  $("add").addEventListener("click", function () { openSheet(null); });
  $("q").addEventListener("input", function (e) { view.q = e.target.value; if (tasks) { renderStats(); renderTabs(); renderListBody(); } });
  $("who").addEventListener("change", function (e) { view.who = e.target.value; render(); });
  $("f-cat").addEventListener("change", function () { fillTypes($("f-cat").value, ""); });
  $("f-type").addEventListener("change", updateTypeUi);
  $("sheet").addEventListener("submit", saveForm);
  $("f-cancel").addEventListener("click", closeSheet);
  $("sheet-close").addEventListener("click", closeSheet);
  $("f-delete").addEventListener("click", deleteClick);
  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });

  $("team").addEventListener("click", makeTeamLink);
  $("linkclose").addEventListener("click", function () { $("linkbox").hidden = true; });
  $("linkcopy").addEventListener("click", function () {
    var el = $("linkval");
    el.select();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(function () { toast("Link copied"); }, function () { toast("Press Ctrl+C to copy the selected link"); });
    else toast("Press Ctrl+C to copy the selected link");
  });
  $("signout").addEventListener("click", function () { if (msalApp && account) msalApp.logoutRedirect({ account: account }); });

  function afterSignIn() {
    if (!me()) $("me").value = account.name || "";
    if (conn) { renderConnect("loading"); loadAll(); } else renderConnect("choose");
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
  }
  function boot() {
    if (!CFG.clientId || /PASTE/.test(CFG.clientId)) { renderConnect("setup"); return; }
    if (!window.msal || !window.msal.PublicClientApplication) { renderConnect("nolib"); return; }
    msalApp = new window.msal.PublicClientApplication({
      auth: {
        clientId: CFG.clientId,
        authority: CFG.authority || "https://login.microsoftonline.com/consumers",
        redirectUri: CFG.redirectUri || (location.origin + location.pathname)
      },
      cache: { cacheLocation: "localStorage" }
    });
    msalApp.initialize().then(function () { return msalApp.handleRedirectPromise(); }).then(function (res) {
      account = (res && res.account) || msalApp.getAllAccounts()[0] || null;
      if (!account) { renderConnect("signin"); return; }
      msalApp.setActiveAccount(account);
      afterSignIn();
    }).catch(function (e) { renderConnect("signin", "Sign-in failed: " + (e && e.message ? e.message : "unknown error")); });
  }
  boot();
})();
</script>
</body>
</html>
